name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runner Python version
        run: python3 --version

      - name: Bootstrap verification environment
        run: ./scripts/bootstrap-venv.sh

      - name: Validate package build
        run: .venv/bin/python -m build

      - name: Verify Gherkin contract coverage
        run: .venv/bin/python scripts/verify_gherkin_contract.py

      - name: Run tests
        run: .venv/bin/python -m pytest tests -q
