name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'prod' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus' }}
  AZURE_CONTAINER_IMAGE_NAME: quotes-api
  AUTH_JWT_ISSUER: ${{ vars.AUTH_JWT_ISSUER || 'platform-auth' }}
  AUTH_JWT_AUDIENCE: quotes-service
  EQUIPMENTS_SERVICE_URL: ${{ vars.EQUIPMENTS_SERVICE_URL || '' }}
  EQUIPMENTS_HEALTH_PATH: ${{ vars.EQUIPMENTS_HEALTH_PATH || '/health' }}
  EQUIPMENTS_CONNECTIVITY_TIMEOUT_SECONDS: ${{ vars.EQUIPMENTS_CONNECTIVITY_TIMEOUT_SECONDS || '3' }}
  SCHEDULES_API_URL: ${{ vars.SCHEDULES_API_URL || 'https://app-schedules-prod-9e31c1.azurewebsites.net' }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Azure CLI is available
        shell: bash
        run: |
          if command -v az >/dev/null 2>&1; then
            az version
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          elif [ "$(id -u)" -eq 0 ]; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          else
            echo "Azure CLI is not installed and sudo is unavailable." >&2
            exit 1
          fi

          az version

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Derive resource names
        shell: bash
        run: |
          repo_token="$(printf '%s' "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-10)"
          env_token="$(printf '%s' "$AZURE_ENV_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-6)"
          sub_hash="$(printf '%s' "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | sha256sum | cut -c1-6)"
          name_prefix="${repo_token}-${env_token}-${sub_hash}"

          {
            echo "AZURE_RESOURCE_GROUP=rg-${name_prefix}"
            echo "AZURE_WEBAPP_NAME=app-${name_prefix}"
            echo "AZURE_CONTAINER_REGISTRY=acr$(printf '%s' "$name_prefix" | tr -d '-')"
          } >> "$GITHUB_ENV"

      - name: Check whether infrastructure exists
        id: preflight
        shell: bash
        run: |
          if az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" >/dev/null 2>&1 \
            && az acr show --name "$AZURE_CONTAINER_REGISTRY" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Azure infrastructure has not been provisioned yet; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate platform auth secret
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        run: |
          if [ -z "$AUTH_JWT_SECRET" ]; then
            echo "AUTH_JWT_SECRET GitHub Actions secret is required for Azure deployment." >&2
            exit 1
          fi

      - name: Build container image in ACR
        if: steps.preflight.outputs.ready == 'true'
        run: |
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "$AZURE_CONTAINER_IMAGE_NAME:${GITHUB_SHA}" \
            --image "$AZURE_CONTAINER_IMAGE_NAME:main" \
            .

      - name: Point web app at the new image
        if: steps.preflight.outputs.ready == 'true'
        run: |
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$AZURE_CONTAINER_REGISTRY.azurecr.io/$AZURE_CONTAINER_IMAGE_NAME:${GITHUB_SHA}" \
            --container-registry-url "https://$AZURE_CONTAINER_REGISTRY.azurecr.io"

      - name: Keep managed identity ACR pulls enabled
        if: steps.preflight.outputs.ready == 'true'
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

      - name: Generate schedules API token
        if: steps.preflight.outputs.ready == 'true'
        env:
          SCHEDULES_JWT_SECRET: ${{ secrets.SCHEDULES_JWT_SECRET }}
        run: |
          if [ -z "$SCHEDULES_JWT_SECRET" ]; then
            SCHEDULES_API_TOKEN=""
          else
            header=$(echo -n '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
            now=$(date +%s)
            exp=$((now + 3600))
            payload=$(echo -n "{\"sub\":\"deploy\",\"iss\":\"schedules-service\",\"aud\":\"schedules-api\",\"exp\":$exp,\"scope\":\"schedules:read\"}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
            sig=$(echo -n "${header}.${payload}" | openssl dgst -sha256 -hmac "$SCHEDULES_JWT_SECRET" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
            echo "SCHEDULES_API_TOKEN=${header}.${payload}.${sig}" >> "$GITHUB_ENV"
          fi

      - name: Apply platform auth app settings
        if: steps.preflight.outputs.ready == 'true'
        env:
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          SCHEDULES_JWT_SECRET: ${{ secrets.SCHEDULES_JWT_SECRET }}
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings \
              AUTH_JWT_ISSUER="$AUTH_JWT_ISSUER" \
              AUTH_JWT_AUDIENCE="$AUTH_JWT_AUDIENCE" \
              AUTH_JWT_SECRET="$AUTH_JWT_SECRET" \
              EQUIPMENTS_SERVICE_URL="$EQUIPMENTS_SERVICE_URL" \
              EQUIPMENTS_HEALTH_PATH="$EQUIPMENTS_HEALTH_PATH" \
              EQUIPMENTS_CONNECTIVITY_TIMEOUT_SECONDS="$EQUIPMENTS_CONNECTIVITY_TIMEOUT_SECONDS" \
            --output none
          if [ -n "$SCHEDULES_JWT_SECRET" ]; then
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings \
                SCHEDULES_API_URL="$SCHEDULES_API_URL" \
                SCHEDULES_JWT_SECRET="$SCHEDULES_JWT_SECRET" \
              --output none
          elif [ -n "$SCHEDULES_API_TOKEN" ]; then
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings \
                SCHEDULES_API_URL="$SCHEDULES_API_URL" \
                SCHEDULES_API_TOKEN="$SCHEDULES_API_TOKEN" \
              --output none
          fi

      - name: Restart web app
        if: steps.preflight.outputs.ready == 'true'
        run: az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"

      - name: Publish deployment summary
        if: steps.preflight.outputs.ready == 'true'
        run: |
          webapp_url="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)"
          {
            echo "## Azure deploy complete"
            echo ""
            echo "- Web app: \`${AZURE_WEBAPP_NAME}\`"
            echo "- Image: \`${AZURE_CONTAINER_REGISTRY}.azurecr.io/${AZURE_CONTAINER_IMAGE_NAME}:${GITHUB_SHA}\`"
            echo "- URL: https://${webapp_url}"
          } >> "$GITHUB_STEP_SUMMARY"
