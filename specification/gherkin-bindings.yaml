version: 1
profiles:
  local:
    base_url_env: QUOTES_CONTRACT_BASE_URL
    timeout_seconds: 10
    tokens:
      admin: QUOTES_CONTRACT_ADMIN_TOKEN
      approve: QUOTES_CONTRACT_APPROVER_TOKEN
  azure:
    base_url_env: QUOTES_CONTRACT_AZURE_BASE_URL
    timeout_seconds: 20
    tokens:
      admin: QUOTES_CONTRACT_AZURE_ADMIN_TOKEN
      approve: QUOTES_CONTRACT_AZURE_APPROVER_TOKEN
fixtures:
  peak_season_quote_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
  quote_revocation_request:
    reason: Customer requested a corrected quote.
scenarios:
  "Create a quote on a seeded peak-season lane":
    binding: smoke.create_peak_season_quote
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
          quote_reference: $.quoteReference
    assertions:
      - action: create_quote
        status: 201
      - action: create_quote
        json_field: $.id
      - action: create_quote
        json_field: $.quoteReference
  "Retrieve a stored quote":
    binding: smoke.retrieve_stored_quote
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
          quote_reference: $.quoteReference
      - name: retrieve_by_id
        method: GET
        path: /quotes/{quote_id}
      - name: retrieve_by_reference
        method: GET
        path: /quotes/reference/{quote_reference}
    assertions:
      - action: create_quote
        status: 201
      - action: retrieve_by_id
        status: 200
      - action: retrieve_by_id
        json_field: $.pricingProvenance
      - action: retrieve_by_reference
        status: 200
      - action: retrieve_by_reference
        json_field: $.quoteReference
  "Validate whether a stored quote can still be booked":
    binding: smoke.validate_stored_quote_bookability
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: check_bookability
        method: GET
        path: /quotes/{quote_id}/bookability
    assertions:
      - action: create_quote
        status: 201
      - action: check_bookability
        status: 200
      - action: check_bookability
        path: $.bookable
        json_equals: true
      - action: check_bookability
        path: $.status
        json_equals: ACTIVE
  "Validate rate coverage before requesting a quote":
    binding: planned.validate_rate_coverage_before_quote
    status: planned
    group: quote-readiness
    profiles: []
    fixtures: []
    actions: []
    assertions: []
  "Plan equipment availability with explicit substitution suggestions":
    binding: planned.plan_equipment_availability
    status: planned
    group: quote-readiness
    profiles: []
    fixtures: []
    actions: []
    assertions: []
  "Persist quote lifecycle events in the outbox":
    binding: planned.persist_quote_lifecycle_events
    status: planned
    group: lifecycle
    profiles: []
    fixtures: []
    actions: []
    assertions: []
  "Revoke an issued quote and block booking reuse":
    binding: smoke.revoke_quote_blocks_booking_reuse
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
      - quote_revocation_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: revoke_quote
        method: POST
        path: /quotes/{quote_id}/revocations
        auth: admin
        actor: ops@quotes
        body_fixture: quote_revocation_request
      - name: check_bookability
        method: GET
        path: /quotes/{quote_id}/bookability
    assertions:
      - action: create_quote
        status: 201
      - action: revoke_quote
        status: 200
      - action: revoke_quote
        path: $.lifecycleState
        json_equals: VOID
      - action: check_bookability
        status: 200
      - action: check_bookability
        path: $.bookable
        json_equals: false
      - action: check_bookability
        path: $.status
        json_equals: VOID
      - action: check_bookability
        path: $.reason
        json_equals: QUOTE_REVOKED
