scenarios:
  "Create a quote on a seeded peak-season lane":
    binding: smoke.create_peak_season_quote
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
          quote_reference: $.quoteReference
    assertions:
      - action: create_quote
        status: 201
      - action: create_quote
        json_field: $.id
      - action: create_quote
        json_field: $.quoteReference
  "Retrieve a stored quote":
    binding: smoke.retrieve_stored_quote
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
          quote_reference: $.quoteReference
      - name: retrieve_by_id
        method: GET
        path: /quotes/{quote_id}
      - name: retrieve_by_reference
        method: GET
        path: /quotes/reference/{quote_reference}
    assertions:
      - action: create_quote
        status: 201
      - action: retrieve_by_id
        status: 200
      - action: retrieve_by_id
        json_field: $.pricingProvenance
      - action: retrieve_by_reference
        status: 200
      - action: retrieve_by_reference
        json_field: $.quoteReference
  "Validate whether a stored quote can still be booked":
    binding: smoke.validate_stored_quote_bookability
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: check_bookability
        method: GET
        path: /quotes/{quote_id}/bookability
    assertions:
      - action: create_quote
        status: 201
      - action: check_bookability
        status: 200
      - action: check_bookability
        path: $.bookable
        json_equals: true
      - action: check_bookability
        path: $.status
        json_equals: ACTIVE
  "Validate rate coverage before requesting a quote":
    binding: readiness.validate_rate_coverage_before_quote
    status: executable
    group: quote-readiness
    profiles:
      - local
      - azure
    fixtures:
      - rate_coverage_request
    actions:
      - name: validate_coverage
        method: POST
        path: /quotes/coverage/validate
        body_fixture: rate_coverage_request
    assertions:
      - action: validate_coverage
        status: 200
      - action: validate_coverage
        path: $.covered
        json_equals: true
      - action: validate_coverage
        path: $.reason
        json_equals: RATE_AVAILABLE
      - action: validate_coverage
        path: $.coverage.0.equipmentType
        json_equals: 20FT
      - action: validate_coverage
        path: $.coverage.1.equipmentType
        json_equals: 40FT_HC
  "Plan equipment availability with explicit substitution suggestions":
    binding: readiness.plan_equipment_availability
    status: executable
    group: quote-readiness
    profiles:
      - local
      - azure
    fixtures:
      - equipment_availability_plan_request
    actions:
      - name: plan_equipment
        method: POST
        path: /quotes/equipment-availability/plan
        body_fixture: equipment_availability_plan_request
    assertions:
      - action: plan_equipment
        status: 200
      - action: plan_equipment
        path: $.status
        json_equals: AVAILABLE_WITH_SUBSTITUTIONS
      - action: plan_equipment
        path: $.available
        json_equals: true
      - action: plan_equipment
        path: $.substitutions.0.substituteType
        json_equals: 40FT_HC
      - action: plan_equipment
        path: $.substitutions.0.quantityCovered
        json_equals: 1
  "Persist quote lifecycle events in the outbox":
    binding: lifecycle.persist_quote_lifecycle_events
    status: executable
    group: lifecycle
    profiles:
      - local
      - azure
    fixtures: []
    requires_env:
      QUOTES_CONTRACT_EXPIRED_QUOTE_ID: Pre-seeded quote created through the public quote API whose validity window has already expired in the selected profile.
    state_from_env:
      expired_quote_id: QUOTES_CONTRACT_EXPIRED_QUOTE_ID
    actions:
      - name: materialize_expired_quote
        method: GET
        path: /quotes/{expired_quote_id}
        save:
          quote_id: $.id
      - name: list_created_events
        method: GET
        path: /admin/outbox-events?aggregateType=quote&aggregateId={quote_id}&eventType=quote.created&limit=10
        auth: admin
      - name: list_expired_events
        method: GET
        path: /admin/outbox-events?aggregateType=quote&aggregateId={quote_id}&eventType=quote.expired&limit=10
        auth: admin
    assertions:
      - action: materialize_expired_quote
        status: 200
      - action: materialize_expired_quote
        path: $.id
        json_equals_state: expired_quote_id
      - action: materialize_expired_quote
        path: $.lifecycleState
        json_equals: EXPIRED
      - action: list_created_events
        status: 200
      - action: list_created_events
        path: $.events.0.aggregateId
        json_equals_state: quote_id
      - action: list_created_events
        path: $.events.0.payload.quoteId
        json_equals_state: quote_id
      - action: list_created_events
        path: $.events.0.eventType
        json_equals: quote.created
      - action: list_created_events
        json_field: $.events.0.payload.pricingProvenance
      - action: list_expired_events
        status: 200
      - action: list_expired_events
        path: $.events.0.aggregateId
        json_equals_state: quote_id
      - action: list_expired_events
        path: $.events.0.payload.quoteId
        json_equals_state: quote_id
      - action: list_expired_events
        path: $.events.0.eventType
        json_equals: quote.expired
      - action: list_expired_events
        json_field: $.events.0.payload.pricingProvenance
  "Revoke an issued quote and block booking reuse":
    binding: smoke.revoke_quote_blocks_booking_reuse
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
      - quote_revocation_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: revoke_quote
        method: POST
        path: /quotes/{quote_id}/revocations
        auth: admin
        actor: ops@quotes
        body_fixture: quote_revocation_request
      - name: check_bookability
        method: GET
        path: /quotes/{quote_id}/bookability
    assertions:
      - action: create_quote
        status: 201
      - action: revoke_quote
        status: 200
      - action: revoke_quote
        path: $.lifecycleState
        json_equals: VOID
      - action: check_bookability
        status: 200
      - action: check_bookability
        path: $.bookable
        json_equals: false
      - action: check_bookability
        path: $.status
        json_equals: VOID
      - action: check_bookability
        path: $.reason
        json_equals: QUOTE_REVOKED
  "Request a quote for a seeded schedule without an effective rate":
    binding: readiness.request_quote_without_effective_rate
    status: executable
    group: quote-readiness
    profiles:
      - local
      - azure
    fixtures:
      - no_effective_rate_quote_request
    actions:
      - name: create_quote_without_rate
        method: POST
        path: /quotes
        body_fixture: no_effective_rate_quote_request
    assertions:
      - action: create_quote_without_rate
        status: 400
      - action: create_quote_without_rate
        path: $.detail
        json_equals: No rate available for 20FT on selected schedule
  "Apply customer contract pricing with surcharge waivers":
    binding: planned.apply_customer_contract_pricing
    status: planned
    group: pricing
    profiles: []
    fixtures: []
    actions: []
    assertions: []
  "Prefer account contract pricing over customer pricing":
    binding: planned.prefer_account_contract_pricing
    status: planned
    group: pricing
    profiles: []
    fixtures: []
    actions: []
    assertions: []
  "Create, update, and activate a managed rate-table version":
    binding: admin.manage_rate_table_version
    status: executable
    group: admin-commercial
    profiles:
      - local
      - azure
    requires_env:
      admin_token: admin
    fixtures:
      - rate_table_version_request
      - rate_table_version_update
      - rate_table_version_quote_request
    actions:
      - name: create_rate_table
        method: POST
        path: /admin/rate-tables
        auth: admin
        actor: pricing.ops@quotes
        body_fixture: rate_table_version_request
        save:
          rate_table_id: $.id
      - name: update_rate_table
        method: PATCH
        path: /admin/rate-tables/{rate_table_id}
        auth: admin
        actor: pricing.ops@quotes
        body_fixture: rate_table_version_update
      - name: activate_rate_table
        method: POST
        path: /admin/rate-tables/{rate_table_id}/activate
        auth: admin
        actor: pricing.manager@quotes
      - name: create_quote_after_activation
