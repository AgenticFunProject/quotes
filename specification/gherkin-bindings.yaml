        path: /quotes/{quote_id}
    assertions:
      - action: create_rate_table
        status: 201
      - action: create_rate_table
        path: $.isActive
        json_equals: false
      - action: update_rate_table
        status: 200
      - action: update_rate_table
        path: $.baseRateUsd
        json_equals: 1615.0
      - action: activate_rate_table
        status: 200
      - action: activate_rate_table
        path: $.isActive
        json_equals: true
      - action: create_quote_after_activation
        status: 201
      - action: retrieve_quote_after_activation
