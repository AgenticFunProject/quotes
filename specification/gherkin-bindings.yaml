  "Reprice an existing quote and explain the commercial variance":
    binding: pricing.reprice_existing_quote
    status: executable
    group: pricing
    profiles:
      - local
      - azure
    fixtures:
      - repricing_original_quote_request
      - repricing_rate_table_request
      - quote_reprice_request
    actions:
      - name: create_original_quote
        method: POST
        path: /quotes
        body_fixture: repricing_original_quote_request
        save:
          original_quote_id: $.id
          original_quote_reference: $.quoteReference
      - name: create_repricing_rate_table
        method: POST
        path: /admin/rate-tables
        auth: admin
        actor: pricing.ops@quotes
        body_fixture: repricing_rate_table_request
        save:
          rate_table_id: $.id
      - name: activate_repricing_rate_table
        method: POST
        path: /admin/rate-tables/{rate_table_id}/activate
        auth: admin
        actor: pricing.manager@quotes
      - name: reprice_quote
        method: POST
        path: /quotes/{original_quote_id}/reprice
        auth: admin
        actor: pricing.ops@quotes
        body_fixture: quote_reprice_request
        save:
          repriced_quote_id: $.id
      - name: retrieve_original_quote
        method: GET
        path: /quotes/{original_quote_id}
      - name: explain_repriced_quote
        method: GET
        path: /quotes/{repriced_quote_id}/explain
    assertions:
      - action: create_original_quote
        status: 201
      - action: create_repricing_rate_table
        status: 201
      - action: activate_repricing_rate_table
        status: 200
      - action: reprice_quote
        status: 201
      - action: reprice_quote
        json_field: $.repricedFromQuoteId
      - action: reprice_quote
        json_field: $.repricedFromQuoteReference
      - action: reprice_quote
        path: $.varianceSummary.direction
        json_equals: HIGHER
      - action: retrieve_original_quote
        status: 200
      - action: retrieve_original_quote
        json_missing: $.varianceSummary
      - action: explain_repriced_quote
        status: 200
      - action: explain_repriced_quote
        json_field: $.varianceSummary.baseRate
  "Return multiple commercial options for one quote request":
    binding: pricing.return_multiple_commercial_options
