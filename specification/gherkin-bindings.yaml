version: 1
profiles:
  local:
    base_url_env: QUOTES_CONTRACT_BASE_URL
    timeout_seconds: 10
    tokens:
      admin: QUOTES_CONTRACT_ADMIN_TOKEN
      approve: QUOTES_CONTRACT_APPROVER_TOKEN
  azure:
    base_url_env: QUOTES_CONTRACT_AZURE_BASE_URL
    timeout_seconds: 20
    tokens:
      admin: QUOTES_CONTRACT_AZURE_ADMIN_TOKEN
      approve: QUOTES_CONTRACT_AZURE_APPROVER_TOKEN
fixtures:
  peak_season_quote_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
  quote_revocation_request:
    reason: Customer requested a corrected quote.
  rate_coverage_request:
    originPort: NLRTM
    destinationPort: USNYC
    departureDate: "2026-08-18"
    equipment:
      - type: 20FT
        quantity: 2
      - type: 40FT_HC
        quantity: 1
  equipment_availability_plan_request:
    depotCode: CNSHA-01
    equipment:
      - type: 40FT
        quantity: 2
    availability:
      - equipmentType: 40FT
        availableCount: 1
        depotCode: CNSHA-01
      - equipmentType: 40HC
        availableCount: 3
        depotCode: CNSHA-01
    substitutions:
      - requestedType: 40FT
        substituteType: 40HC
        priority: 1
        reason: High-cube unit is acceptable for standard 40-foot dry demand
  no_effective_rate_quote_request:
    scheduleId: 1ce1ab21-9d58-4a6d-b867-afc93098352f
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 12000
  repricing_original_quote_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    equipment:
      - type: 40FT
        quantity: 1
    cargoWeightKg: 18000
    currency: EUR
  repricing_rate_table_request:
    originPort: NLRTM
    destinationPort: USNYC
    equipmentType: 40FT
    baseRateUsd: 1510
    validFrom: "2026-04-01"
    validTo: "2026-12-31"
  quote_reprice_request:
    trigger: COMMERCIAL_REFRESH
  alternative_options_quote_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    customerId: cust-acme
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
    includeAlternativeOptions: true
  bounded_alternative_options_quote_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    customerId: cust-acme
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
    includeAlternativeOptions: true
    maxAlternativeOptions: 1
  bounded_alternative_options_disabled_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    customerId: cust-acme
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
    maxAlternativeOptions: 1
  invalid_low_alternative_options_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    customerId: cust-acme
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
    includeAlternativeOptions: true
    maxAlternativeOptions: 0
  invalid_high_alternative_options_request:
    scheduleId: df62a7d2-a45e-4d4d-b3cb-b4af65435274
    customerId: cust-acme
    equipment:
      - type: 20FT
        quantity: 1
    cargoWeightKg: 18000
    includeAlternativeOptions: true
    maxAlternativeOptions: 11
scenarios:
  "Create a quote on a seeded peak-season lane":
    binding: smoke.create_peak_season_quote
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
          quote_reference: $.quoteReference
    assertions:
      - action: create_quote
        status: 201
      - action: create_quote
        json_field: $.id
      - action: create_quote
        json_field: $.quoteReference
  "Retrieve a stored quote":
    binding: smoke.retrieve_stored_quote
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
          quote_reference: $.quoteReference
      - name: retrieve_by_id
        method: GET
        path: /quotes/{quote_id}
      - name: retrieve_by_reference
        method: GET
        path: /quotes/reference/{quote_reference}
    assertions:
      - action: create_quote
        status: 201
      - action: retrieve_by_id
        status: 200
      - action: retrieve_by_id
        json_field: $.pricingProvenance
      - action: retrieve_by_reference
        status: 200
      - action: retrieve_by_reference
        json_field: $.quoteReference
  "Validate whether a stored quote can still be booked":
    binding: smoke.validate_stored_quote_bookability
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: check_bookability
        method: GET
        path: /quotes/{quote_id}/bookability
    assertions:
      - action: create_quote
        status: 201
      - action: check_bookability
        status: 200
      - action: check_bookability
        path: $.bookable
        json_equals: true
      - action: check_bookability
        path: $.status
        json_equals: ACTIVE
  "Validate rate coverage before requesting a quote":
    binding: readiness.validate_rate_coverage_before_quote
    status: executable
    group: quote-readiness
    profiles:
      - local
      - azure
    fixtures:
      - rate_coverage_request
    actions:
      - name: validate_coverage
        method: POST
        path: /quotes/coverage/validate
        body_fixture: rate_coverage_request
    assertions:
      - action: validate_coverage
        status: 200
      - action: validate_coverage
        path: $.covered
        json_equals: true
      - action: validate_coverage
        path: $.reason
        json_equals: RATE_AVAILABLE
      - action: validate_coverage
        path: $.coverage.0.equipmentType
        json_equals: 20FT
      - action: validate_coverage
        path: $.coverage.1.equipmentType
        json_equals: 40FT_HC
  "Plan equipment availability with explicit substitution suggestions":
    binding: readiness.plan_equipment_availability
    status: executable
    group: quote-readiness
    profiles:
      - local
      - azure
    fixtures:
      - equipment_availability_plan_request
    actions:
      - name: plan_equipment
        method: POST
        path: /quotes/equipment-availability/plan
        body_fixture: equipment_availability_plan_request
    assertions:
      - action: plan_equipment
        status: 200
      - action: plan_equipment
        path: $.status
        json_equals: AVAILABLE_WITH_SUBSTITUTIONS
      - action: plan_equipment
        path: $.available
        json_equals: true
      - action: plan_equipment
        path: $.substitutions.0.substituteType
        json_equals: 40FT_HC
      - action: plan_equipment
        path: $.substitutions.0.quantityCovered
        json_equals: 1
  "Persist quote lifecycle events in the outbox":
    binding: lifecycle.persist_quote_lifecycle_events
    status: executable
    group: lifecycle
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
    requires_env:
      QUOTES_CONTRACT_EXPIRED_QUOTE_ID: Pre-seeded quote whose validity window has already expired in the selected profile.
    state_from_env:
      expired_quote_id: QUOTES_CONTRACT_EXPIRED_QUOTE_ID
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: materialize_expired_quote
        method: GET
        path: /quotes/{expired_quote_id}/bookability
      - name: list_created_events
        method: GET
        path: /admin/outbox-events?aggregateType=quote&eventType=quote.created&limit=10
        auth: admin
      - name: list_expired_events
        method: GET
        path: /admin/outbox-events?aggregateType=quote&eventType=quote.expired&limit=10
        auth: admin
    assertions:
      - action: create_quote
        status: 201
      - action: materialize_expired_quote
        status: 200
      - action: materialize_expired_quote
        path: $.status
        json_equals: EXPIRED
      - action: list_created_events
        status: 200
      - action: list_created_events
        path: $.events.0.eventType
        json_equals: quote.created
      - action: list_created_events
        json_field: $.events.0.payload.pricingProvenance
      - action: list_expired_events
        status: 200
      - action: list_expired_events
        path: $.events.0.eventType
        json_equals: quote.expired
      - action: list_expired_events
        json_field: $.events.0.payload.pricingProvenance
  "Revoke an issued quote and block booking reuse":
    binding: smoke.revoke_quote_blocks_booking_reuse
    status: executable
    group: smoke
    profiles:
      - local
      - azure
    fixtures:
      - peak_season_quote_request
      - quote_revocation_request
    actions:
      - name: create_quote
        method: POST
        path: /quotes
        body_fixture: peak_season_quote_request
        save:
          quote_id: $.id
      - name: revoke_quote
        method: POST
        path: /quotes/{quote_id}/revocations
        auth: admin
        actor: ops@quotes
        body_fixture: quote_revocation_request
      - name: check_bookability
        method: GET
        path: /quotes/{quote_id}/bookability
    assertions:
      - action: create_quote
        status: 201
      - action: revoke_quote
        status: 200
      - action: revoke_quote
        path: $.lifecycleState
        json_equals: VOID
      - action: check_bookability
        status: 200
      - action: check_bookability
        path: $.bookable
        json_equals: false
      - action: check_bookability
        path: $.status
        json_equals: VOID
      - action: check_bookability
        path: $.reason
        json_equals: QUOTE_REVOKED
  "Request a quote for a seeded schedule without an effective rate":
    binding: readiness.request_quote_without_effective_rate
    status: executable
    group: quote-readiness
